# configs/default.yaml
# Default configuration for Palette Attention Model

model:
  encoder:
    backbone: resnet18
    pretrained: true
    freeze_backbone: true
    input_adapter_channels: 1
    output_channels: 512

  embedding:
    colour_vocab_size: 52
    category_vocab_size: 27
    embed_dim: 64

  lstm_core:
    encoder_dim: 512
    style_dim: 128
    hidden_size: 256
    num_layers: 2
    dropout: 0.1
    rnn_type: gru

  attention:
    encoder_dim: 512
    hidden_size: 256
    style_dim: 128
    attn_dim: 256
    use_silhouette_mask: true

  decoder:
    context_dim: 512
    lstm_dim: 256
    style_dim: 128
    vocab_size: 27
    dropout: 0.1

training:
  batch_size: 32
  epochs: 50
  lr: 0.0001
  grad_clip: 0.5
  warmup_steps: 500
  save_every: 5
  log_every: 50
  betas: [0.9, 0.999]
  weight_decay: 0.00001

loss:
  mse_weight: 1.0
  perceptual_weight: 0.1
  token_weight: 0.1
  vgg_layer: 16

scheduler:
  type: cosine_annealing
  T_max: 50
  eta_min: 0.000001

data:
  vocab_dir: /kaggle/input/datasets/manjushwarkhairkar/vocab_and_category
  img_size: 224
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  num_workers: 2
  pin_memory: false
  random_seed: 42
  img_mean: [0.485, 0.456, 0.406]
  img_std: [0.229, 0.224, 0.225]
  sketch_mean: [0.5]
  sketch_std: [0.5]

evaluation:
  checkpoint_dir: /kaggle/working/checkpoints
  best_model: /kaggle/working/checkpoints/best_model.pt
  output_dir: /kaggle/working/outputs
  save_interval: 5
  eval_interval: 1
  metrics:
    compute_fid: true
    compute_perceptual: true
    visualize_attention: true

logging:
  log_interval: 50
  save_samples_interval: 500
  use_wandb: false
  wandb_project: palette-attention
  output_dir: /kaggle/working/outputs

device:
  cuda: true
  device_id: 0